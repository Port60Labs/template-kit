name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # Use the runner's existing SUID helper; retain Chromium and Ubuntu sandboxing.
      CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node bin/cli.mjs setup-previews --with-deps
      - name: Verify the runner's sandbox helper
        run: test -u "$CHROME_DEVEL_SANDBOX" && test -x "$CHROME_DEVEL_SANDBOX"
      - run: npm test
