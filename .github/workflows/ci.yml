name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Install the preview browsers, eight minutes a try and one retry
        timeout-minutes: 18
        run: |
          for attempt in 1 2; do
            timeout 8m node bin/cli.mjs setup-previews --with-deps && exit 0
            echo "browser install attempt $attempt did not finish"
          done
          exit 1
      - name: Enable the browser sandbox for this CI executable only
        run: |
          sudo install -o root -g root -m 644 .github/preview-browser.apparmor /etc/apparmor.d/port60-preview-browser
          sudo apparmor_parser -r /etc/apparmor.d/port60-preview-browser
      - run: npm test
